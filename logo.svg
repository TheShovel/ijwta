<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Khuwari logo">
  <!-- the frame: one keyframe, the canvas -->
  <rect x="9" y="9" width="46" height="46" rx="10" fill="none" stroke="#8aa3b9" stroke-width="3.5"/>
  <!-- the interpolation mesh, warped toward the pull -->
  <path d="M9 40 C 20 38, 32 34, 44 28" fill="none" stroke="#8fb0a2" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M32 9 C 34 18, 38 24, 44 28" fill="none" stroke="#8fb0a2" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- the inbetween keyframe, tugging the mesh out of the frame -->
  <path d="M40 22 L52 16 L62 28 L50 36 Z" fill="#c3ab7d" stroke="#1b1f25" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
